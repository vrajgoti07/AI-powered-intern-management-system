<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 64 64" fill="none">
  <!-- Deep Dark Navy Background (Full Bleed) -->
  <rect width="64" height="64" fill="#0f172a"/>
  
  <g transform="translate(6.4, 6.4) scale(0.8)">
    <!-- Main Icon Elements with Rx Background -->
    <rect width="64" height="64" rx="14" fill="#1e293b"/>
    
    <!-- Human figure silhouette (left) -->
    <circle cx="21" cy="24" r="7" fill="#ffffff"/>
    <path d="M10,48 Q21,32 32,48" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>

    <!-- AI orbit ring system (right, centered at 45,32) -->
    <circle cx="45" cy="32" r="11" fill="none" stroke="#3b82f6" stroke-width="2"/>
    <circle cx="45" cy="32" r="6" fill="none" stroke="#60a5fa" stroke-width="1.5"/>
    <circle cx="45" cy="32" r="2.5" fill="#ffffff"/>

    <!-- Orbit node dots -->
    <circle cx="45" cy="21" r="2.5" fill="#ffffff"/>
    <circle cx="56" cy="32" r="2.5" fill="#ffffff"/>
    <circle cx="45" cy="43" r="2.5" fill="#ffffff"/>
    <circle cx="34" cy="32" r="2.5" fill="#ffffff"/>
  </g>
</svg>
