services:
  postgres:
    image: postgres:15-alpine
    container_name: intern_management_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internflow-network

  redis:
    image: redis:7-alpine
    container_name: intern_management_redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - internflow-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: intern_management_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - ./backend/.env
    environment:
      # Safeguard: Force connection to containerized local resources instead of production Neon/Upstash
      - DATABASE_URL=postgresql://postgres:postgres_password@postgres:5432/postgres?schema=public
      - REDIS_URL=redis://redis:6379
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - NODE_ENV=development
      - PORT=5000
      - FRONTEND_URL=http://localhost:3000
      - AI_SERVICE_URL=http://ai_service:8000
      - CORS_ORIGIN=http://localhost:3000
    ports:
      - "5000:5000"
    command: >
      sh -c "npx prisma migrate deploy && node dist/server.js"
    networks:
      - internflow-network

  ai_service:
    build:
      context: ./ai_service
      dockerfile: Dockerfile
    container_name: intern_management_ai
    restart: always
    depends_on:
      - redis
    env_file:
      - ./ai_service/.env
    environment:
      # Safeguard: Force connection to local resources instead of production Neon/Upstash
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=http://backend:5000/
      - ENV=development
      - FASTAPI_HOST=0.0.0.0
      - FASTAPI_PORT=8000
      - FRONTEND_URL=http://localhost:3000
      - CORS_ORIGINS=["http://localhost:3000","http://localhost:5000"]
    ports:
      - "8000:8000"
    networks:
      - internflow-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:5000/api/v1
        - VITE_AI_URL=http://localhost:8000
    container_name: intern_management_frontend
    restart: always
    depends_on:
      - backend
      - ai_service
    ports:
      - "3000:80"
    networks:
      - internflow-network

networks:
  internflow-network:
    driver: bridge

volumes:
  pg_data:
    driver: local
